name: Fiyatları Güncelle

on:
  schedule:
    # Günde 2 kez: 06:00 ve 14:00 UTC = Türkiye saatiyle (UTC+3) 09:00 ve 17:00
    - cron: '0 6,14 * * *'
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilir

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fiyatları çek
        run: node fetch-prices.js

      - name: prices.json'ı commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Fiyatları güncelle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

